# The demo camps keep confirming their needs, as real camps would, so the live board is never empty when someone
# looks at it. Every need still lapses by itself the moment this stops: nothing here bypasses Entity Expiration.
# GitHub delivers scheduled runs irregularly: on an hourly cron we measured gaps of 3 to 5 hours. So this asks four
# times an hour, and the seed re-confirms a need once a tenth of its lifetime has passed: a 6-hour need survives a gap
# of about 5 hours with the same key. Each run writes only what has aged, so most runs send no transaction at all.
name: Keep the demo camps confirming

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    # Pinned, so the ubuntu-latest move to a new image on 19 October cannot break the keepalive during judging.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Re-confirm ageing needs and keep the demo pledge alive
        run: npm run seed
        env:
          SEED_WALLETS_JSON: ${{ secrets.SEED_WALLETS_JSON }}
          ARKIV_KEY: ${{ secrets.ARKIV_KEY }}
          FUNDER_PK: ${{ secrets.FUNDER_PK }}
